<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel ="stylesheet" href ="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="container">
      <h1 class="title">Выбери свой продукт</h1>
          
      <div class="buttons">
        <button id="add-to-basket-all">Добавить все в корзину</button>
        <button id="select-to-payment">Перейти к оплате</button>
        <button id="output-console-log">Вывести сообщение в консоль лог</button>
      </div>

      <ul class="products-list">
        <template class="template_product_cart">
          <li class="card">
            <img class="card__image" src="" alt=""/>
            <p class="card__skin-type"></p>
            <h2 class="card__product-name"></h2>
            <p class="card__product-description"></p>
            <span class="card__structure-text">Состав:</span>
            <ul class="card__structure">
              <li></li>
              <li></li>
              <li></li>
            </ul>
            <div class="card__product-price">
              <b>Цена</b>
              <span class="price"></span>
            </div>
            <button id="add-to-basket">Добавить в корзину</button>
          </li>
        </template>
      </ul>
    </div>
    <script src="main.js"></script> 
    <script src="homework-10.js" type="module"></script>
  </body>

</html>
